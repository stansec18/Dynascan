[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynascan"
version = "0.1.0"
description = "DAST scanner with authenticated/unauthenticated scanning, OWASP Top 10 (web + API) mapping and threat modelling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dast", "security", "owasp", "vulnerability-scanner", "threat-modeling", "api-security", "pentest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
dynascan = "dynascan.cli:main"

[project.gui-scripts]
dynascan-gui = "dynascan.gui.app:main"

[tool.setuptools.packages.find]
include = ["dynascan*"]

[tool.setuptools.package-data]
"dynascan" = ["report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
